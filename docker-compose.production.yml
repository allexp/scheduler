services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: app
    restart: unless-stopped
    env_file:
      - ${SCHEDULER_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend
    mem_limit: 640m

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/scheduler/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/scheduler/ssl/private.key:/etc/nginx/ssl/private.key:ro
    depends_on:
      - app
    networks:
      - backend
    mem_limit: 64m

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: app
    restart: unless-stopped
    command: php artisan queue:work rabbitmq --queue=default --sleep=1 --tries=3 --timeout=60
    env_file:
      - ${SCHEDULER_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend
    mem_limit: 384m

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: app
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ${SCHEDULER_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend
    mem_limit: 256m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    mem_limit: 640m

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    mem_limit: 448m

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    mem_limit: 192m

volumes:
  app_storage:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  backend:
    driver: bridge
